<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Z Skills — Documentation</title>
  <!--
    FOUC-prevention inline script. MUST run before the <link rel="stylesheet">
    below so the [data-theme="..."] selector on <html> is in place by first
    paint — no flash on hard reload. Default mode is `dark` (the viewer ships
    dark-first); persisted to localStorage under `zskills-docs-theme`. The
    toggle wiring in docs-app.js re-uses the same storage key. Two-state
    cycle only: dark ↔ light (no `system` branch / no OS-preference query).
  -->
  <script>
  (function() {
    var s = localStorage.getItem('zskills-docs-theme') || 'dark';
    var dark = s !== 'light';
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  })();
  </script>
  <link rel="stylesheet" href="./docs.css">
</head>
<body>
  <div id="zl-docs-app">
    <header id="zl-docs-header">
      <a href="#docs/README.md" class="zl-docs-logo" style="color:#5db0ff">Z Skills Docs</a>
      <span class="zl-docs-header-title">Documentation</span>
      <button id="zl-docs-theme-toggle"
              class="zl-docs-theme-toggle"
              type="button"
              aria-label="Theme: dark (click to switch)">🌙</button>
    </header>
    <div id="zl-docs-layout">
      <nav id="zl-docs-nav"></nav>
      <main id="zl-docs-main">
        <p class="zl-docs-loading">Loading&hellip;</p>
      </main>
    </div>
  </div>
  <script type="module" src="./docs-app.js"></script>
</body>
</html>

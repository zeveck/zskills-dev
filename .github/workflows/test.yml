name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Required by tests/test-update-zskills-migration.sh case 6c
          # (commit-cohabitation): the test uses `git log -1 -- <path>` and
          # `merge-base --is-ancestor`, both of which need full history.
          # With the default fetch-depth: 1 (shallow), case 6c's prior code
          # would silently call `pass "shallow clone — skipped"` and the
          # test was invisible in CI for ~24h while drift accumulated on
          # main (issue surfaced 2026-05-01). Phase B of recovery.
          fetch-depth: 0

      - name: Configure git for test setup
        run: |
          git config --global user.email "ci@zskills.test"
          git config --global user.name "CI Test Runner"
          git config --global init.defaultBranch main

      - name: Run full test suite
        # TEST_SUITE_PARALLELIZATION Phase 4 — parallel fan-out. The runner
        # caps workers at min(configured, nproc); ubuntu-latest is ~4 cores, so
        # nproc=4 is the binding ceiling here (no -j / matrix needed). ONE
        # gating `test` job is preserved (no matrix) so the merge-gate status
        # check stays a single contract. Default (no flag) stays serial.
        run: ZSKILLS_PARALLEL=1 bash tests/run-all.sh

      - name: Bash syntax check on hooks and scripts
        run: |
          for f in hooks/*.sh hooks/*.template scripts/*.sh; do
            [ -f "$f" ] || continue
            echo "Checking: $f"
            bash -n "$f" || exit 1
          done

      - name: Verify installed skill copies match source
        run: |
          drift=0
          for src in skills/*/SKILL.md; do
            name=$(basename "$(dirname "$src")")
            installed=".claude/skills/$name/SKILL.md"
            if [ -f "$installed" ]; then
              if ! diff -q "$src" "$installed" >/dev/null; then
                echo "DRIFT: $installed differs from $src"
                drift=1
              fi
            fi
          done
          [ "$drift" -eq 0 ] || exit 1

      - name: Check for stdin bash-ism regression
        run: |
          # Regression: $(</dev/stdin) fails silently in the hook context.
          # Use $(cat) instead. See commit 33f987b for history.
          if grep -rn '\$(</dev/stdin)' hooks/ .claude/hooks/ 2>/dev/null; then
            echo "ERROR: \$(</dev/stdin) found — use \$(cat) instead"
            exit 1
          fi
          echo "No stdin bash-ism found"

      # Phase D of 2026-05-01 recovery: branch protection requires the
      # `test` status check on PR ref (refs/pull/N/merge), but does NOT
      # require it to stay green on main HEAD after merge. Between
      # 2026-04-30T04:23 and 2026-05-01T01:09, post-merge Tests on main
      # was red across PRs #128, #131, #135-#142 because case 6c
      # (commit-cohabitation) silently skipped on shallow clones. ~24h
      # of unnoticed red main. Phase B (PR #147) closed the silent-skip;
      # this canary makes any FUTURE post-merge red loud by
      # auto-filing/commenting an issue.
      #
      # Only fires on push events to main when an earlier step in this
      # job failed. PR-context failures don't trigger (those are
      # surface-visible on the PR already).
      - name: Open issue on red main (post-merge canary)
        if: ${{ failure() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -e
          SHA_SHORT="${SHA:0:8}"
          # Idempotently ensure the label exists so first-fire works.
          gh label create "main-broken" \
            --color "d73a4a" \
            --description "Tests failed on main HEAD (post-merge canary)" \
            2>/dev/null || true
          # If an unresolved 'main-broken' issue exists, comment on it
          # rather than spam-creating duplicates.
          EXISTING=$(gh issue list --label main-broken --state open --json number --jq '.[0].number' 2>/dev/null || true)
          BODY=$(cat <<MSG
          Tests failed on \`main\` HEAD \`${SHA_SHORT}\`.

          - Commit: \`${SHA}\`
          - Run: ${RUN_URL}

          Branch protection only enforces the \`test\` check on PR refs (\`refs/pull/N/merge\`), not on \`main\` after merge. This issue is the post-merge canary that fires when a push to main produces a red Tests run.

          **Action**: investigate the failure (read the run logs), then either fix forward (PR with the fix) or revert the breaking commit. See PR #145 / 2026-05-01 recovery for the precedent.

          *Auto-filed by \`.github/workflows/test.yml\` on red push to main.*
          MSG
          )
          if [ -n "$EXISTING" ]; then
            echo "Existing main-broken issue #${EXISTING} is open — appending comment."
            gh issue comment "$EXISTING" --body "$BODY"
          else
            echo "No open main-broken issue — creating new one."
            gh issue create \
              --title "[main-broken] Tests failed on main @ ${SHA_SHORT}" \
              --label "bug" \
              --label "main-broken" \
              --body "$BODY"
          fi

  # ─── Plugin-mode CI lane (W5.1, F-DA1-6) ──────────────────────────────────
  # zskills ships via TWO permanent install lanes (plugin + /update-zskills).
  # The `test` job above gates the source tree. This job gates the PLUGIN
  # lane's manifests + (best-effort) the plugin loader. It is documented as
  # THREE explicit tiers:
  #
  #   Tier 1 (cheap, MANDATORY — runs on every PR): Python JSON-schema
  #     validation of both plugin.json files (zs + zsbd) and marketplace.json,
  #     via tests/test-plugin-manifest.sh + tests/test-plugin-marketplace.sh.
  #     These are stdlib-json (no jq) and have no external dependency, so they
  #     are the gating floor. A failure here fails the PR.
  #
  #   Tier 2 (moderate, BEST-EFFORT): if a `claude` CLI is reachable on the
  #     runner, run `claude plugin validate --strict .` (marketplace) and
  #     `claude plugin validate --strict ./block-diagram` (zsbd plugin). The
  #     CLI is NOT installed by default on GitHub runners and no stable
  #     public install URL is pinned here, so this tier SKIPS-with-reason when
  #     `claude` is absent or install fails. It never blocks the PR (the step
  #     is `continue-on-error` semantics via an explicit `|| true` after a
  #     reachability probe). If tier 2 becomes chronically flaky (>50% of runs
  #     skip for non-CLI reasons), tier 1 remains the gating floor (Abort/
  #     Rollback in PLUGIN_DISTRIBUTION.md Phase 5).
  #
  #   Tier 3 (expensive, DEFERRED — NOT in this plan): an actual agentic
  #     dispatch `claude -p '/zs:briefing summary'` to prove the plugin's
  #     skills resolve end-to-end under a real model. Tracked as a follow-up
  #     issue; intentionally absent here.
  plugin-mode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tier 1 — MANDATORY manifest + marketplace schema validation.
      - name: "Tier 1 (mandatory): plugin + marketplace manifest validation"
        run: |
          set -e
          echo "== zs + zsbd plugin.json schema =="
          bash tests/test-plugin-manifest.sh
          echo "== marketplace.json schema (incl. D10 version lockstep) =="
          bash tests/test-plugin-marketplace.sh
          echo "== build push targets ↔ consumer-resolved refs (bare main + bare <version> tag) =="
          bash tests/test-plugin-ref-consistency.sh

      # Mirror-less prod-tree dogfood — builds a SHIPPED plugin tree (git
      # archive HEAD + build-plugin-release.sh strip set) and a mirror-LESS
      # consumer, then proves lane-portable script resolution works on the
      # real plugin path. This is the regression gate for the Phase 1-4
      # `$CLAUDE_PROJECT_DIR/.claude/skills/...` → `$ZSKILLS_SKILLS_ROOT`
      # migration; it would have caught the original bug class. Needs the full
      # git history (checkout@v4 provides HEAD).
      - name: "Tier 1 (mandatory): mirror-less plugin-lane resolution dogfood"
        run: |
          set -e
          bash tests/test-plugin-mirrorless-resolution.sh

      # D4 existence gate — runs the REAL publisher build-prod.sh (the script
      # ship-to-prod.yml runs; refs are bare main + a bare <version> tag) in an
      # isolated throwaway clone and asserts the built prod tree CONTAINS
      # a suffixless sibling of every hooks/*.sh.template (block-agents.sh +
      # block-unsafe-project.sh today — the safety hooks hooks.json registers
      # on the plugin lane), byte-equal to its .template. A regression that
      # removes/breaks the D4 generation loop ships a plugin missing those
      # safety hooks; this gate fails it red instead of letting it ship silent.
      - name: "Tier 1 (mandatory): D4 built prod tree contains hook siblings"
        run: |
          set -e
          bash tests/test-plugin-d4-hook-siblings.sh

      # Tier 2 — BEST-EFFORT claude plugin validate --strict. Skips with a
      # documented reason when the CLI is not reachable. Never blocks the PR.
      - name: "Tier 2 (best-effort): claude plugin validate --strict"
        run: |
          if command -v claude >/dev/null 2>&1; then
            echo "claude CLI present — running strict plugin validation."
            claude plugin validate --strict . || {
              echo "::warning::claude plugin validate --strict . returned non-zero."
              exit 1
            }
            claude plugin validate --strict ./block-diagram || {
              echo "::warning::claude plugin validate --strict ./block-diagram returned non-zero."
              exit 1
            }
          else
            echo "::notice::SKIP tier 2 — no \`claude\` CLI on the runner (no stable public install URL pinned). Tier 1 remains the gating floor. See .github/workflows/test.yml plugin-mode comment + PLUGIN_DISTRIBUTION.md Phase 5."
          fi

      # Tier 3 — DEFERRED. Documented here so the absence is intentional, not
      # an oversight. An actual `claude -p '/zs:briefing summary'` dispatch is
      # tracked as a follow-up issue and is NOT part of this plan.
      - name: "Tier 3 (deferred): agentic /zs:briefing dispatch — follow-up only"
        run: echo "::notice::Tier 3 (claude -p '/zs:briefing summary') is intentionally deferred to a follow-up issue. Not run here."
